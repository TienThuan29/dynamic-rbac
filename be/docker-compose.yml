version: "3.9"

# docker-compose.yml — Full local development environment
#
# Prerequisites:
#   1. Copy be/.env.example to be/.env and fill in values
#   2. docker compose up
#
# Services:
#   postgres     — PostgreSQL database
#   authmodule   — AuthModule (port 5001)
#   mainmodule   — MainModule (port 5002)
#   localgateway — LocalGateway / YARP proxy (port 5000)
#   frontend     — React frontend (port 3000)
#
# Environment: set vars in be/.env

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  authmodule:
    build:
      context: ./AuthModule
      dockerfile: Dockerfile
    container_name: authmodule
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB:-postgres};
        Username=${POSTGRES_USER:-postgres};
        Password=${POSTGRES_PASSWORD:-yourpassword}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      JWT_ISSUER: ${JWT_ISSUER:-swovnai}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swovnai}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/permissions || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  mainmodule:
    build:
      context: ./MainModule
      dockerfile: Dockerfile
    container_name: mainmodule
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB:-postgres};
        Username=${POSTGRES_USER:-postgres};
        Password=${POSTGRES_PASSWORD:-yourpassword}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      authmodule:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/products || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  localgateway:
    build:
      context: ./LocalGateway
      dockerfile: Dockerfile
    container_name: localgateway
    environment:
      GATEWAY_MODE: Local
      AUTH_MODULE_URL: http://authmodule:8080
      MAIN_MODULE_URL: http://mainmodule:8080
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5000:8080"
    depends_on:
      authmodule:
        condition: service_healthy
      mainmodule:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../fe
      dockerfile: Dockerfile
      args:
        VITE_MAIN_API_BASE_URL: http://localhost:5000/api
        VITE_AUTH_API_BASE_URL: http://localhost:5000/api
    container_name: frontend
    environment:
      NODE_ENV: production
    ports:
      - "3000:8080"
    depends_on:
      - localgateway

volumes:
  postgres_data:
